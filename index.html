<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d16">
<title>IPTV INDIA Premium v10.2</title>
  br
  <title>ASHOK KUMAR YADAW - IPTV Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>▶ IPTV INDIA</strong><small>Premium v10.2</small></div>
  <div class="actions">
    <button id="themeBtn">☀</button>
    <button id="refreshBtn">↻</button>
  </div>
</header>

<main>
  <section class="player">
    <div class="videoWrap">
      <video id="video" controls playsinline preload="metadata"></video>
      <div id="status" class="status">Loading…</div>
    </div>
    <div class="now">
      <img id="nowLogo" alt="">
      <div class="nowText"><b id="nowName">Channel select करें</b><span id="nowMeta">Playlist loading…</span></div>
      <button id="prevBtn">◀</button><button id="nextBtn">▶</button><button id="fullBtn">⛶</button>
    </div>
  </section>

  <section class="searchRow">
    <input id="search" placeholder="Channel / category / language खोजें…">
    <button id="clearBtn">×</button>
  </section>

  <section class="stats">
    <div><small>CHANNELS</small><b id="total">0</b></div>
    <div><small>FAVORITES</small><b id="favorites">0</b></div>
    <div><small>STATUS</small><b id="loadStatus">Loading</b></div>
  </section>

  <section id="categories" class="categories"></section>
  <div class="heading"><b id="heading">All Channels</b><span id="count"></span></div>
  <section id="grid" class="grid"></section>
</main>

<div id="errorBox" class="error hide"></div>

<script src="video.js"></script>
</body>
</html>
